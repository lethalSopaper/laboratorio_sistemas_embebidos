<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Panel de Control</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        .adc-value { font-size: 3em; color: #007BFF; margin: 20px 0; font-weight: bold; }
        input[type="text"] { padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lectura del Potenciómetro</h1>
        <!-- El valor del ADC (0 a 4095) se actualizará aquí -->
        <div class="adc-value" id="adc_val">---</div>

        <hr>

        <h3>Mensaje para OLED</h3>
        <input type="text" id="mensaje" placeholder="Escribe un mensaje">
        <button onclick="enviarMensaje()">Enviar a ESP32</button>
    </div>

    <script>
        // Abrir conexión WebSocket en la ruta /ws
        var ws = new WebSocket('ws://' + location.host + '/ws');

        // Recibir la medición por WebSocket y actualizar la página
        ws.onmessage = function(event) {
            document.getElementById('adc_val').innerText = event.data;
        };

        // Enviar el texto ingresado al ESP32 por la misma conexión
        function enviarMensaje() {
            var msg = document.getElementById('mensaje').value;
            if(ws.readyState === WebSocket.OPEN) {
                ws.send(msg);
            }
        }
    </script>
</body>
</html>
